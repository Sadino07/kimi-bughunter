name: sync-upstream

# Bot de sincronización: re-convierte el bundle Claude-BugHunter al formato
# Kimi Code cada vez que el upstream publica cambios, y sube el resultado
# a este repo solo si la validación pasa.

on:
  schedule:
    # todos los días 05:41 UTC (el upstream refresca CVEs semanalmente)
    - cron: '41 5 * * *'
  workflow_dispatch: {} # permite dispararlo a mano desde la pestaña Actions

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clonar upstream
        run: git clone --depth 1 https://github.com/elementalsouls/Claude-BugHunter.git /tmp/upstream

      - name: Convertir a formato Kimi
        run: python3 convert_to_kimi.py --src /tmp/upstream --dst ./skills --clean

      - name: Validar skills
        run: python3 validate_skills.py ./skills

      - name: Commitear y pushear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/
          if git diff --staged --quiet; then
            echo "Sin cambios: el upstream no se movió."
          else
            git commit -m "sync: actualización desde upstream $(date -u +%Y-%m-%d)"
            git push
            echo "Cambios subidos."
          fi

      - name: Abrir issue si el sync falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Sync upstream falló el $(date -u +%Y-%m-%d)" \
            --body "El workflow [sync-upstream](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) falló. Revisar los logs; probablemente el upstream cambió el formato de sus SKILL.md." \
            --label "bug" || true
